<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<title>Nothing to see here</title>
<style>
 
  :root {
    --bg:    #111113;
    --fg:    #6d6d74;
    --dim:   #45454b;
    --faint: #2c2c31;
    --glow:  #d6cfbf;
  }
  :root.lit {
    --bg:    #1c1913;
    --fg:    #b3a98f;
    --dim:   #7a705c;
    --faint: #4d4638;
  }

  * { box-sizing: border-box; }
  html { background: var(--bg); transition: background 2.5s ease; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    color: var(--fg);
    font: 16px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    transition: color 2.5s ease;
  }

  header { padding: clamp(24px, 6vw, 56px) clamp(20px, 6vw, 64px) 0; }
  h1 { margin: 0; font-size: 1rem; font-weight: 400; letter-spacing: .02em; }

  /* The full stop at the end of the heading is a real button. */
  .dot {
    font: inherit; color: inherit; background: none;
    border: 0; padding: 0; margin: 0; cursor: inherit;
    transition: color .4s;
  }
  .dot:hover { color: #8c8c94; }
  .dot:focus-visible { outline: 1px solid var(--faint); outline-offset: 3px; }

  .sub { margin: .4rem 0 0; font-size: .8rem; color: var(--dim); }

  /* "empty" tells a small lie. Hover or focus it. */
  .whisper {
    position: relative;
    border-bottom: 1px dotted var(--faint);
    outline: none;
  }
  .whisper::after {
    content: attr(data-whisper);
    position: absolute; left: 0; top: 1.8em;
    white-space: nowrap;
    color: var(--fg);
    opacity: 0;
    transition: opacity .6s ease;
    pointer-events: none;
  }
  .whisper:hover::after,
  .whisper:focus-visible::after { opacity: 1; }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 0 clamp(20px, 6vw, 64px);
  }

  /* The big empty region. It listens. */
  .void {
    position: relative;
    flex: 1;
    min-height: 45vh;
    overflow: hidden;
    cursor: default;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .void:focus-visible { outline: 1px dashed var(--faint); outline-offset: -4px; }
  .void::before {
    content: "A fist, a door, five letters. Type it.";
    position: absolute; left: 1rem; bottom: 1rem;
    font-size: .7rem;
    opacity: 0;
    pointer-events: none;
  }
  .void.awake {
    background: radial-gradient(60% 60% at 50% 50%, rgba(255,255,255,.028), transparent 70%);
  }
  .ring {
    position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px;
    border: 1px solid var(--dim); border-radius: 50%;
    pointer-events: none;
    animation: ring .8s ease-out forwards;
  }

  #log { padding: 1rem 0 1.25rem; font-size: .78rem; color: var(--dim); }
  .line { margin: .35rem 0; max-width: 40rem; animation: fade 1.4s ease both; }
  .line .n { color: var(--fg); }
  .line .w { color: #8e8e96; letter-spacing: .08em; }

  .say { margin: 0 0 1.5rem; animation: fade 2s ease both; }
  .say input {
    width: min(28rem, 100%);
    background: transparent; color: var(--fg);
    border: 0; border-bottom: 1px solid var(--faint);
    font: inherit; font-size: .85rem;
    padding: .3rem 0; outline: none;
    transition: border-color .3s;
  }
  .say input:focus { border-bottom-color: var(--dim); }
  .say input::placeholder { color: var(--faint); }
  .say input.nope { animation: shake .35s ease; border-bottom-color: #5a3b3b; }
  #note { min-height: 1.2em; margin: .35rem 0 0; font-size: .72rem; color: var(--dim); }

  .reveal { margin: 1rem 0 3rem; max-width: 34rem; color: var(--glow); animation: fade 2.5s ease both; }
  .reveal h2 { margin: 0 0 1rem; font-size: 1.4rem; font-weight: 400; outline: none; }
  .reveal p  { margin: .7rem 0; }
  .reveal .prize { margin-top: 1.6rem; padding: 1rem; border: 1px dashed currentColor; }

  footer {
    padding: 0 clamp(20px, 6vw, 64px) 24px;
    font-size: .68rem; color: var(--dim);
  }
  .c { cursor: default; outline: none; transition: color .25s; }
  .c.pulse { color: var(--fg); }
  .c:focus-visible { outline: 1px solid var(--faint); outline-offset: 2px; }

  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ring  { to { transform: scale(14); opacity: 0; } }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<!-- you found the markup. good. the page calls itself "empty". check that claim. -->
<header>
  <h1><span id="title">Nothing to see here</span><button type="button" class="dot" id="dot" aria-label="full stop">.</button></h1>
  <p class="sub">This page is <span class="whisper" id="whisper" tabindex="0">empty</span>.</p>
</header>

<main>
  <!-- the emptiest thing on this page has attributes. -->
  <div class="void" id="void" role="button" tabindex="0" aria-label="empty space"></div>

  <div id="log" aria-live="polite"></div>

  <form class="say" id="say" autocomplete="off" hidden>
    <label class="sr-only" for="phrase">say it</label>
    <input id="phrase" type="text" spellcheck="false" autocapitalize="off" placeholder="say it">
    <p id="note" aria-live="polite"></p>
  </form>
</main>

<!-- small print: press the © three times, quickly. it only answers to persistence. -->
<footer>
  <span class="c" id="c" role="button" tabindex="0" aria-label="copyright">©</span> 2026 · nobody home · v0.4.1
</footer>

<script>
(() => {
  'use strict';

  
  const CONFIG = {
  
    words: ['the', 'quiet', 'room', 'remembers'],

    // Typed on the keyboard (anywhere on the page, no Enter key needed).
    knockWord: 'knock',

    // Footer: this many presses on the (c) symbol, each within this gap.
    footerPresses: 3,
    footerGapMs: 1500,

    
    storageKey: 'nts.progress.v1',

    // Shown after the correct phrase is entered. Plain text only.
    reveal: {
      title: 'You were listening.',
      paragraphs: [
        'Everyone else saw an empty page. You checked the full stop, read the small print, asked the walls what they were made of, and knocked on nothing.',
        '"Nothing to see here" was never a lie. It was an invitation.',
        'The room remembers. So will whoever sent you here, so go and tell them you reached the end.'
      ],
      // Optional: what the finder wins / where to collect it. '' hides the box.
      prize: 'The professor awaits your arrival...'
    }
  };

  /* ==================================================================== */

  const W = CONFIG.words;
  const N = W.length;
  const phrase = W.join(' ');
  const $ = (id) => document.getElementById(id);
  const el = {
    title: $('title'), dot: $('dot'), whisper: $('whisper'), voidEl: $('void'),
    log: $('log'), say: $('say'), input: $('phrase'), note: $('note'), c: $('c'),
    main: document.querySelector('main')
  };
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* ---------- progress (survives refresh; harmless if storage is blocked) ---------- */
  const state = { dot: false, hover: false, footer: false, knock: false, void: false, solved: false };
  try {
    if (performance.getEntriesByType("navigation")[0]?.type === "reload") {
      localStorage.removeItem(CONFIG.storageKey);
      history.replaceState(null, '', location.pathname);
    } else {
      Object.assign(state, JSON.parse(localStorage.getItem(CONFIG.storageKey) || '{}'));
    }
  } catch (e) { /* storage unavailable: progress simply lasts for this visit */ }
  const save = () => { try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) {} };

  /* ---------- the words the page whispers back (the transcript) ---------- */
  const LINES = {
    dot:    { n: 1, w: W[0], text: N + ' words in all. The page says what it is. Check that it is telling the truth.' },
    hover:  { n: 2, w: W[1], text: 'Small print is still print.' },
    footer: { text: 'The walls are thinner than they look. Right-click the emptiest part of the page and ask what it is.' },
    knock:  { text: 'Something in the emptiest place just held its breath. It is listening. Press on it.' },
    void:   { n: N, w: '?', text: 'You knocked. It has kept every knock since. What does a room do with all of that? Say the whole thing.' }
  };
  const shown = {};
  function addLine(key) {
    if (shown[key]) return;
    shown[key] = true;
    const L = LINES[key];
    const p = document.createElement('p');
    p.className = 'line';
    if (L.n) {
      const n = document.createElement('span'); n.className = 'n'; n.textContent = L.n + '/' + N;
      const w = document.createElement('span'); w.className = 'w'; w.textContent = L.w;
      p.append(n, ' · ', w, ' · ');
    }
    p.append(L.text);
    el.log.appendChild(p);
  }

  /* ---------- tiny helpers ---------- */
  function ripple(x, y) {
    if (reduceMotion) return;
    const r = document.createElement('span');
    r.className = 'ring';
    r.style.left = x + 'px';
    r.style.top = y + 'px';
    el.voidEl.appendChild(r);
    setTimeout(() => r.remove(), 900);
  }
  const normalise = (s) => String(s).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

 
  el.whisper.dataset.whisper = '2/' + N + ' · ' + W[1];       // also revealed by hover
  el.voidEl.setAttribute('data-fragment', '3/' + N + ' · ' + W[2]);


  console.log('%cNothing to see here.', 'color:#777;font:13px monospace');
  console.log("%cA sentence isn't finished until you've checked the full stop.", 'color:#555;font:12px monospace');


  el.dot.addEventListener('click', () => {
    if (state.dot) return;
    state.dot = true; save(); addLine('dot');
  });


  function onWhisper() {
    if (state.hover) return;
    state.hover = true; save(); addLine('hover');
  }
  el.whisper.addEventListener('mouseenter', onWhisper);
  el.whisper.addEventListener('focus', onWhisper);


  let presses = 0, pressTimer = null;
  function onFooter() {
    el.c.classList.add('pulse');
    setTimeout(() => el.c.classList.remove('pulse'), 250);
    presses++;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => { presses = 0; }, CONFIG.footerGapMs);
    if (presses >= CONFIG.footerPresses) {
      presses = 0;
      if (!state.footer) { state.footer = true; save(); addLine('footer'); }
    }
  }
  el.c.addEventListener('click', onFooter);
  el.c.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onFooter(); }
  });

  /* ====================================================================
     EASTER EGG 4: the keyboard sequence
     // not a cheat code. it's manners: lowercase, no Enter key.
     // what do you do at a door?
     ==================================================================== */
  let keyBuf = '';
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if (!e.key || e.key.length !== 1) return;
    keyBuf = (keyBuf + e.key.toLowerCase()).slice(-CONFIG.knockWord.length);
    if (keyBuf === CONFIG.knockWord) { keyBuf = ''; onKnock(); }
  });

  function onKnock() {
    // the void only answers once it has been addressed properly
    const first = !state.knock;
    state.knock = true; save();
    el.voidEl.classList.add('awake');
    if (first) addLine('knock');
    const pattern = W[N - 1].toUpperCase().replace(/E/g, '_');
    console.log('%cwhatever the quiet room hears, it keeps.', 'color:#777;font:13px monospace');
    console.log('%c' + N + '/' + N + '  \u2192  ' + pattern, 'color:#999;font:13px monospace');
    if (pattern !== W[N - 1].toUpperCase()) {
      console.log('%c(every blank is the same letter, the commonest one in English)', 'color:#555;font:12px monospace');
    }
  }

  /* ====================================================================
     EASTER EGG 5: the "empty" region is clickable. It only answers after
     the knock; before that it just ripples.
     ==================================================================== */
  function onVoid(x, y) {
    ripple(x, y);
    if (!state.knock || state.void) return;
    state.void = true; save();
    addLine('void');
    showSay(true);
  }
  el.voidEl.addEventListener('click', (e) => {
    const r = el.voidEl.getBoundingClientRect();
    onVoid(e.clientX - r.left, e.clientY - r.top);
  });
  el.voidEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      onVoid(el.voidEl.clientWidth / 2, el.voidEl.clientHeight / 2);
    }
  });

  /* ====================================================================
     EASTER EGG 6: the locked final section (phrase entry)
     ==================================================================== */
  function showSay(focus) {
    el.say.hidden = false;
    if (focus && !state.solved) el.input.focus({ preventScroll: true });
  }

  el.say.addEventListener('submit', (e) => {
    e.preventDefault();
    const guess = normalise(el.input.value);
    if (!guess) return;
    if (guess === normalise(phrase)) { solve(true); return; }
    el.input.classList.remove('nope');
    void el.input.offsetWidth;                       // restart the shake
    el.input.classList.add('nope');
    el.note.textContent = guess.split(' ').length !== N ? N + ' words.' : 'not quite.';
    el.input.select();
    setTimeout(() => { el.input.classList.remove('nope'); el.note.textContent = ''; }, 2200);
  });

  function solve(animate) {
    state.solved = true; save();
    el.say.hidden = true;
    document.documentElement.classList.add('lit');
    el.title.textContent = 'Something to see here';
    el.whisper.textContent = 'full';
    el.whisper.removeAttribute('data-whisper');

    const R = CONFIG.reveal;
    const sec = document.createElement('section');
    sec.className = 'reveal';
    sec.setAttribute('aria-labelledby', 'reveal-title');
    const h = document.createElement('h2');
    h.id = 'reveal-title'; h.tabIndex = -1; h.textContent = R.title;
    sec.appendChild(h);
    R.paragraphs.forEach((t) => { const p = document.createElement('p'); p.textContent = t; sec.appendChild(p); });
    if (R.prize) { const pz = document.createElement('p'); pz.className = 'prize'; pz.textContent = R.prize; sec.appendChild(pz); }
    el.main.appendChild(sec);
    if (animate) {
      h.focus({ preventScroll: true });
      sec.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'center' });
    }
  }

  /* ---------- restore a returning visitor ---------- */
  ['dot', 'hover', 'footer', 'knock', 'void'].forEach((k) => { if (state[k]) addLine(k); });
  if (state.knock) el.voidEl.classList.add('awake');
  if (state.void)  showSay(false);
  if (state.solved) solve(false);
})();
</script>
</body>
</html>
